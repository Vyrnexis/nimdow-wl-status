# nimdow-wl-status configuration
#
# Location (first match wins):
#   --config <path>
#   $XDG_CONFIG_HOME/nimdow-wl/status.toml   (default ~/.config/nimdow-wl/status.toml)
#   built-in default (this file, embedded at compile time)
#
# The file is reloaded automatically when it changes (and on SIGHUP). An invalid
# file is reported on stderr and the running configuration is kept.
# Check a file without running:  nimdow-wl-status --check-config [--config <path>]
#
# ORDER MATTERS: the order of the [[segment]] tables is the bar order, the
# nimdow-wl click region number (1-based, left to right) and the signal number
# for refreshing it (SIGRTMIN+N, e.g. `pkill -RTMIN+4 nimdow-wl-stat`).
#
# Colours are accepted as:
#   "#rrggbb"            hex
#   "<palette>.<name>"   gruvbox, nord, dracula, catppuccin, rosepine (case-insensitive),
#                        e.g. "gruvbox.aqua", "nord.nord8", "catppuccin.Mauve"
#   "<name>"             a name defined in [colours] below
# "color" is accepted everywhere as an alias of "colour".

[bar]
# Default segment shape for all segments. One of:
#   arrow, arrow_l, arrow_r, circle, circle_l, circle_r, angle_a, angle_b, none
style = "angle_b"

# Optional named colours, usable anywhere a colour is accepted.
# [colours]
# accent = "#689d6a"
# warn   = "gruvbox.red1"

# Keys common to every segment:
#   module       (required) archupdates | weather | memory | pulse | battery | wifi | datetime | command
#   icon         text shown before the body (default "")
#   colour       background colour (default "#282828")
#   style        overrides [bar] style for this segment
#   interval     seconds between refreshes (number, fractions allowed); 0 = never (event driven).
#                Omitted = the module's default (shown below)
#   show_always  show the segment even when its body is empty (default false)
# Module-specific options are documented at each module.
# archupdates, pulse and wifi may appear only once (a duplicate is skipped with a warning).

# Pending pacman updates (needs `checkupdates`). Shows UPDATING while pacman holds its lock.
[[segment]]
module = "archupdates"           # default interval: 600
icon = " "
colour = "gruvbox.aqua"
show_always = true
interval = 600
# colour_busy   = "#fb4934"      # colour while pacman is running (default "#fb4934")
# updating_text = "UPDATING"     # body while pacman is running
# timeout       = 60             # seconds before checkupdates is killed

# Temperature from wttr.in (needs `curl`).
[[segment]]
module = "weather"               # default interval: 600
icon = " "
colour = "gruvbox.blue"
interval = 600
# location = "Perth"             # wttr.in location
# format   = "%t"                # wttr.in format string, e.g. "%c+%t"
# retry    = 60                  # seconds before retrying after a failed request

# Used memory.
[[segment]]
module = "memory"                # default interval: 2
icon = " "
colour = "gruvbox.purple"
interval = 2
# method   = "htop"              # "htop" (htop's formula) or "available" (MemTotal - MemAvailable)
# decimals = 2                   # decimals shown for GiB values

# Default sink volume, follows `pactl subscribe` (needs `pactl`).
[[segment]]
module = "pulse"                 # default interval: 0 (event driven)
colour = "gruvbox.orange"
# icon_volume = " "
# icon_mute   = "󰖁 "

# Laptop battery.
[[segment]]
module = "battery"               # default interval: 5
colour = "gruvbox.green"
# icons = [" ", " ", " ", " ", " ", " "]   # charging, empty, low, half, 3qtr, full (exactly 6)
# name  = "BAT0"                 # /sys/class/power_supply/<name>; default = first battery found

# Network link (wifi SSID / ethernet / disconnected). Needs `nmcli` for the SSID.
[[segment]]
module = "wifi"                  # default interval: 5
colour = "gruvbox.bg2"
show_always = true
interval = 5
# icon_wifi         = " "
# icon_ethernet     = "󰈀"
# icon_disconnected = " "
# show_ssid         = true

# Date and time using Nim's `times` format. Aligned to the minute, or to the second
# when the format contains seconds ("s"). An explicit interval overrides the alignment.
[[segment]]
module = "datetime"
icon = " "
colour = "gruvbox.yellow"
# format = "ddd d MMM HH:mm "

# Your own script: run through `sh -c` every `interval` seconds; the body is the
# first line of stdout, stripped. Any number of command segments may be used.
# [[segment]]
# module = "command"             # default interval: 60
# icon = " "
# colour = "nord.nord8"
# command = "uptime -p | sed 's/^up //'"
# timeout = 10                   # seconds before the command is killed
# hide_on_error = false          # true: empty body on non-zero exit instead of "N/A"
