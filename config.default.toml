# nimdow-wl-status configuration
#
# Location (first match wins):
#   --config <path>
#   $XDG_CONFIG_HOME/nimdow-wl/status.toml   (default ~/.config/nimdow-wl/status.toml)
#   built-in default (this file, embedded at compile time)
#
# The file reloads when it changes (and on SIGHUP). An invalid file is reported on stderr
# and the running configuration is kept. Check one with:
#   nimdow-wl-status --check-config [--config <path>]
#
# ORDER MATTERS: [[segment]] order = bar order = click region N = signal SIGRTMIN+N
# (e.g. `pkill -RTMIN+3 nimdow-wl-stat`). SIGUSR1 reruns every segment.
#
# A colour is "#rrggbb" or a name from [colours]. "color" is an alias of "colour".

[bar]
# Default segment shape: arrow arrow_l arrow_r circle circle_l circle_r angle_a angle_b none
style = "angle_b"
# Text colour for all segments. Unset: nimdow-wl's barForegroundColor applies.
# text_colour = "#ebdbb2"

# Named colours, usable wherever a colour is accepted (also in script output).
# [colours]
# accent = "#689d6a"

# Keys common to every segment:
#   module       (required) datetime memory cpu battery net command stream
#   icon         text shown before the body (default "")
#   colour       background colour (default "#282828")
#   text_colour  foreground colour (default: [bar] text_colour)
#   style        overrides [bar] style
#   interval     seconds between refreshes, fractions ok; 0 = only on signal
#                (default per module, shown below)
#   show_always  show the segment even when its body is empty (default false)

# Used memory.
[[segment]]
module = "memory"                # interval default: 2
icon = "󰍛 "
colour = "#b16286"
# method   = "htop"              # "htop" (htop's formula) or "available" (MemTotal - MemAvailable)
# decimals = 2                   # decimals for GiB values

# CPU usage over the interval, from /proc/stat.
[[segment]]
module = "cpu"                   # interval default: 2
icon = " "
colour = "#458588"
# decimals = 0

# Laptop battery; shows N/A when there is none.
[[segment]]
module = "battery"               # interval default: 5
colour = "#98971a"
# icons = [" ", "󰂎 ", "󱊡 ", "󱊢 ", "󱊢 ", "󱊣 "]   # charging, empty, low, half, 3qtr, full (exactly 6)
# name  = "BAT0"                 # default: first battery found

# Network link: wifi / ethernet / disconnected icon. Reads sysfs; only the SSID uses `nmcli`.
[[segment]]
module = "net"                   # interval default: 5
colour = "#504945"
show_always = true
# icon_wifi         = " "
# icon_ethernet     = "󰈀"
# icon_disconnected = " "
# show_ssid         = true       # needs nmcli; false = icon only

# Date and time, Nim `times` format. Aligned to the minute (to the second if the format
# has an "s"); an explicit interval overrides that.
[[segment]]
module = "datetime"
icon = " "
colour = "#d79921"
# format = "ddd d MMM HH:mm "

# Your own scripts. Each stdout line is `text` or `text<TAB>colour`; the colour holds until
# the next line. Commands run via `sh -c` in this file's directory.
#
# command: run every `interval`; the first output line is the body; a non-zero exit shows
# N/A (or hides the segment with hide_on_error).
# [[segment]]
# module = "command"             # interval default: 60
# command = "scripts/updates.sh" # scripts/weather.sh [location] is the same kind
# icon = " "
# colour = "#689d6a"
# interval = 600
# timeout = 10                   # seconds before it is killed
# hide_on_error = false
# show_always = true
#
# stream: one long-running process, every line replaces the body. If it exits it restarts
# (0.5s doubling to 30s). Needs pactl.
# [[segment]]
# module = "stream"
# command = "scripts/volume.sh"
# colour = "#d65d0e"
